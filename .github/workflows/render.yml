name: Render video

on:
  workflow_dispatch:
    inputs:
      chunks:
        description: Number of parallel render chunks
        required: false
        type: number
        default: 4
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPOSITION_ID: Demo
  ENTRY_POINT: src/index.ts
  TOTAL_FRAMES: 300
  NODE_VERSION: "22"

jobs:
  plan:
    name: Plan chunks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      chunk-count: ${{ steps.plan.outputs.chunk-count }}
    steps:
      - name: Compute frame ranges
        id: plan
        env:
          RAW_CHUNKS: ${{ github.event_name == 'workflow_dispatch' && inputs.chunks || 4 }}
        run: |
          set -euo pipefail
          CHUNKS="${RAW_CHUNKS:-4}"
          if ! [[ "$CHUNKS" =~ ^[0-9]+$ ]] || [ "$CHUNKS" -lt 1 ]; then
            echo "Invalid chunks value: $CHUNKS" >&2
            exit 1
          fi
          if [ "$CHUNKS" -gt 256 ]; then
            echo "GitHub Actions allows at most 256 matrix jobs" >&2
            exit 1
          fi

          TOTAL="${TOTAL_FRAMES}"
          BASE=$((TOTAL / CHUNKS))
          if [ "$BASE" -lt 1 ]; then
            echo "Too many chunks for ${TOTAL} frames" >&2
            exit 1
          fi

          python3 - <<'PY'
          import json, os
          total = int(os.environ["TOTAL_FRAMES"])
          chunks = int(os.environ["RAW_CHUNKS"] or "4")
          base = total // chunks
          matrix = []
          for i in range(chunks):
              start = i * base
              end = total - 1 if i == chunks - 1 else start + base - 1
              matrix.append({
                  "id": f"{i:03d}",
                  "start": start,
                  "end": end,
                  "frames": end - start + 1,
              })
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"chunk-count={chunks}\n")
              f.write("matrix=")
              f.write(json.dumps(matrix, separators=(",", ":")))
              f.write("\n")
          print(json.dumps(matrix, indent=2))
          PY

  render:
    name: Render chunk ${{ matrix.chunk.id }} (${{ matrix.chunk.start }}-${{ matrix.chunk.end }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome / Linux rendering libraries
        run: |
          set -euo pipefail
          sudo apt-get update
          # Official Remotion Linux deps for Ubuntu 24.04 (GitHub-hosted ubuntu-latest).
          sudo apt-get install -y --no-install-recommends \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0
          npx remotion browser ensure

      - name: Render frames ${{ matrix.chunk.start }}-${{ matrix.chunk.end }}
        run: |
          mkdir -p out
          npx remotion render "${ENTRY_POINT}" "${COMPOSITION_ID}" \
            "out/chunk-${{ matrix.chunk.id }}.mp4" \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} \
            --codec=h264 \
            --muted \
            --pixel-format=yuv420p \
            --crf=18 \
            --overwrite

      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.id }}
          path: out/chunk-${{ matrix.chunk.id }}.mp4
          if-no-files-found: error
          retention-days: 7

  merge:
    name: Merge chunks
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true

      - name: Concatenate chunks
        run: |
          set -euo pipefail
          ls -la chunks
          : > concat.txt
          for f in $(ls chunks/chunk-*.mp4 | sort); do
            printf "file '%s'\n" "$(pwd)/$f" >> concat.txt
          done
          cat concat.txt

          if ! ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video.mp4; then
            echo "Stream copy failed; re-encoding to guarantee a clean join"
            ffmpeg -y -f concat -safe 0 -i concat.txt \
              -c:v libx264 -pix_fmt yuv420p -crf 18 -movflags +faststart \
              video.mp4
          fi

          ffprobe -hide_banner -show_format -show_streams video.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
          if-no-files-found: error
          retention-days: 14

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="render-${{ github.run_number }}"
          NOTES=$(cat <<MD
          Parallel Remotion render from [run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - Composition: Demo (1920×1080, 30fps, 300 frames / 10s)
          - Chunks: ${{ needs.plan.outputs.chunk-count }}
          MD
          )
          gh release create "$TAG" video.mp4 \
            --title "Render #${{ github.run_number }}" \
            --notes "$NOTES"

      - name: Job summary
        run: |
          {
            echo "## Render complete"
            echo
            echo "- Chunks: ${{ needs.plan.outputs.chunk-count }}"
            echo "- Artifact: \`video\` (video.mp4)"
            echo "- Release: https://github.com/${{ github.repository }}/releases/tag/render-${{ github.run_number }}"
            echo
            echo '```'
            ffprobe -hide_banner video.mp4 2>&1 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
